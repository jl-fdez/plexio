services:
  plexio:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - plexio-data:/app/data
    # Si no usas Caddy o quieres acceso directo por IP:puerto, descomenta la siguiente línea:
    # ports:
    #   - "${PORT:-7777}:80"
    depends_on:
      - redis
    networks:
      - plexio-net

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - plexio-net

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"

    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - plexio
    networks:
      - plexio-net

volumes:
  plexio-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  plexio-net:
    driver: bridge
