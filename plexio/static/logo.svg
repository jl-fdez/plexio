<svg viewBox="0 0 128 128" width="128" height="128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="pxGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="60" y1="60" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Redondeado Dark -->
  <rect width="128" height="128" rx="36" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="124" height="124" rx="34" fill="none" stroke="url(#borderGrad)" stroke-width="3" opacity="0.85" />

  <!-- Monograma PX Futurista -->
  <g filter="url(#neonGlow)">
    <!-- Letra P -->
    <path
      d="M32 96 V32 H61 C72.8 32 82.5 41.6 82.5 53.3 C82.5 65.1 72.8 74.7 61 74.7 H48"
      stroke="url(#pxGrad)"
      stroke-width="10.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Letra X cruzada -->
    <path
      d="M58.7 48 L96 96"
      stroke="url(#pxGrad)"
      stroke-width="10.5"
      stroke-linecap="round"
    />
    <path
      d="M96 32 L74.7 58.7"
      stroke="url(#pxGrad)"
      stroke-width="10.5"
      stroke-linecap="round"
    />

    <!-- Núcleo central brillante -->
    <circle cx="66.7" cy="61.3" r="6.5" fill="url(#coreGlow)" />
  </g>
</svg>
